packages:
  # apps/docs intentionally excluded from the workspace install/lockfile.
  # Docusaurus pulls image-size <=2.0.2 (GHSA-5p2g-fcmc-qvqq) and there is
  # still no patched release on npm. Re-enable when image-size publishes a fix.
  - "apps/demo"
  - "apps/playground"
  - "packages/*"
  - "workers/*"

# Supply-chain hygiene: skip packages published in the last 24h (1440 min).
# Protects forkers from compromised fresh releases like the chalk/debug 2025 attack.
minimumReleaseAge: 1440

# Single source of truth for cross-workspace versions. Reference with `"typescript": "catalog:"`.
catalog:
  # Language
  typescript: 5.8.3

  # React
  react: 18.3.1
  react-dom: 18.3.1
  react-router-dom: ^6.28.0
  "@types/react": ^18.3.12
  "@types/react-dom": ^18.3.1

  # Animation (demo app)
  framer-motion: ^11.15.0

  # Build tooling
  vite: ^7.0.0
  "@vitejs/plugin-react": ^4.3.4
  tsdown: ^0.22.0

  # Test tooling
  # Bumped at TASK-007 to satisfy peer-dep contract:
  #   @cloudflare/vitest-pool-workers@0.16.6 requires vitest ^4.1.0
  #   (the old pinning of 3.2/0.6 mismatched peers; no tests existed yet,
  #    so migration cost was zero).
  vitest: ^4.1.11
  "@cloudflare/vitest-pool-workers": ^0.16.6
  jest: ^29.7.0
  ts-jest: ^29.2.5
  jest-environment-jsdom: ^29.7.0
  "@testing-library/react": ^16.0.0
  "@testing-library/jest-dom": ^6.6.3
  "@testing-library/user-event": ^14.5.2
  "@types/jest": ^29.5.14
  identity-obj-proxy: ^3.0.0

  # Cloudflare Workers
  hono: ^4.13.7
  wrangler: ^4.90.0
  "@cloudflare/workers-types": ^4.20251101.0

  # Styling
  tailwindcss: ^4.1.0
  "@tailwindcss/vite": ^4.1.0
  "@tailwindcss/postcss": ^4.1.0

  # Lint / format
  "@antfu/eslint-config": ^3.10.0
  eslint: ^9.39.0
  prettier: ^3.4.2

  # Misc shared
  "@types/node": ^20.17.0

# Security overrides (moved from package.json "pnpm.overrides"; pnpm 11 only reads them here).
overrides:
  "serialize-javascript": "^7.0.5"
  "http-proxy-agent": "^7.0.0"
  "ws@>=8.0.0 <8.20.1": "^8.20.1"
  "shell-quote": ">=1.9.0"
  "websocket-driver": ">=0.7.5"
  "hono": ">=4.13.7"
  "fast-uri": ">=3.1.5"
  "undici": ">=8.10.2"
  "postcss": ">=8.5.18"
  "brace-expansion@^1.0.0": "^1.1.21"
  "brace-expansion@^2.0.0": "^2.1.7"
  "brace-expansion@^3.0.0": "^3.0.9"
  "brace-expansion@>=4.0.0 <5.0.12": "^5.0.12"
  "tinypool@<2.1.2": "^2.1.2"
  "js-yaml": ">=5.4.1"
  "sharp": ">=0.35.4"
  "ws": ">=8.21.0"
  "form-data": ">=4.0.6"
  "vite": ">=7.3.5"
  "esbuild": ">=0.28.1"
  "svgo": ">=3.3.4"
  "webpack-dev-server": ">=5.2.6"
  "http-proxy-middleware": ">=2.0.10"
  "launch-editor": ">=2.14.1"
  "joi": ">=17.13.4"
  "uuid": ">=11.1.1"
  "body-parser": ">=1.20.6"
  "@babel/core": ">=7.29.6"
  "react-router": "7.18.2"
  "react-router-dom": "7.18.2"
  "@remix-run/router": ">=1.23.3"
  "source-map-js": "^1.2.2"
  "handlebars": "^4.7.10"
